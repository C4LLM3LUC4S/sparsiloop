[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsiloop"
version = "0.1.0a8"
description = "Inspectable local experiments in communication-constrained feedback control"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Homepage = "https://github.com/C4LLM3LUC4S/sparsiloop"
Source = "https://github.com/C4LLM3LUC4S/sparsiloop"
Issues = "https://github.com/C4LLM3LUC4S/sparsiloop/issues"
Documentation = "https://github.com/C4LLM3LUC4S/sparsiloop/blob/main/README.en.md"

[project.scripts]
sparsiloop = "event_control_lab.__main__:main"
event-control-lab = "event_control_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["event_control_lab*"]
namespaces = false

[tool.setuptools.package-data]
"event_control_lab.web" = ["*.html", "*.js", "*.css"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
