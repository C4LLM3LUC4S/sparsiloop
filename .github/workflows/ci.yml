name: SparsiLoop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Preview source without installing dependencies
        run: python quickstart.py --mode controllers --method ilc --no-open --out artifacts/source-preview
      - name: Install build tools
        run: python -m pip install build ruff
      - name: Check source
        run: python -m ruff check .
      - name: Check page history continuation and repeated-plan recovery
        run: node --test --test-reporter=tap tests/web_history_memory.test.js tests/web_record_input.test.js tests/web_continuation_downloads.test.js
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Check offline install, APIs, CLI and extracted source tests
        run: >-
          python scripts/check_distribution.py
          --wheel dist/sparsiloop-0.1.0a2-py3-none-any.whl
          --sdist dist/sparsiloop-0.1.0a2.tar.gz
          --out artifacts/ci-package

  simple-pid-integration:
    name: Pinned simple-pid / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install only the pinned optional library
        run: python -m pip install --require-hashes -r examples/requirements-simple-pid.txt
      - name: Check real-library integration and information boundaries
        run: python -m unittest discover -s integration_tests -v
      - name: Run the public source recipe
        run: python -m examples.simple_pid_case --out artifacts/simple-pid-case

  community-release:
    name: Checked GitHub alpha distribution
    needs: [distribution, simple-pid-integration]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release SparsiLoop v0.1.0a2')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the accepted source
        run: |
          python -m pip install build
          python -m pip install --no-deps .
          python -m build
      - name: Verify the actual distributions
        run: python scripts/check_distribution.py --wheel dist/sparsiloop-0.1.0a2-py3-none-any.whl --sdist dist/sparsiloop-0.1.0a2.tar.gz --out artifacts/release-package
      - name: Bind the offline bundle to this public commit
        run: >-
          python scripts/build_release.py --dist dist --out release-assets
          --ci-url https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Publish the authorized alpha after checking every downloaded draft asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish_github_release.py --assets release-assets
          --notes docs/releases/0.1.0a2.md --publish
